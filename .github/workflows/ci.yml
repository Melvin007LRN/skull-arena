name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/arena-sync-and-countdown]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests, TypeScript and production build
        run: npm run build
